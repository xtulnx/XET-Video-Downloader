[project]
name = "xet-video-downloader"
version = "0.1.0"
description = "小鹅通视频批量下载工具 - 使用 Playwright 捕获 m3u8 地址并通过 yt-dlp 下载"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "playwright>=1.40.0",
    "psutil>=7",
    "rich>=13.7.0",
    "yt-dlp[default]==2026.10.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py", "capture.py", "examples.py", "memory_hls.py", "download_worker.py", "runtime_tools.py"]

[dependency-groups]
dev = []

